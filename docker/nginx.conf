user  www-data;
worker_processes  auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # Must stay at or above upload_max_filesize in php.ini, or nginx rejects a
    # large photo before PHP ever sees it and the user gets a bare 413.
    client_max_body_size 20M;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    server {
        # __PORT__ is substituted by docker/entrypoint.sh from Render's $PORT.
        listen      __PORT__ default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        # ------------------------------------------------------------------
        # Security headers.
        #
        # `always` is load-bearing: without it nginx omits these on error
        # responses, so a 403 or a 500 - the pages most worth not framing -
        # would ship bare.
        #
        # INHERITANCE TRAP: add_header does NOT merge. A location block that
        # declares even one add_header discards every header inherited from
        # here, so `location /build/` below repeats what it still needs.
        # ------------------------------------------------------------------

        # The application is never legitimately framed, so clickjacking on the
        # record-keeping screens is simply refused. frame-ancestors is the
        # modern form; X-Frame-Options covers browsers that predate it.
        add_header X-Frame-Options "DENY" always;

        # An uploaded file must never be re-interpreted as HTML or script.
        # BroodcockPhotoController sets this per-response as well - that one
        # documents the risk where it lives; this one covers everything else.
        add_header X-Content-Type-Options "nosniff" always;

        # Band numbers and record ids sit in paths. Don't hand them to a third
        # party because someone followed an outbound link.
        add_header Referrer-Policy "same-origin" always;

        # The farm has no use for any of these, and the quietest permission is
        # one the browser was told not to grant.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Render terminates TLS in front of this container and serves the site
        # over https only, so pinning it is safe. Two years, with subdomains.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # A DELIBERATELY PARTIAL CSP.
        #
        # frame-ancestors, base-uri and object-src are absolute wins: nothing in
        # this application frames itself, rewrites its own <base>, or embeds a
        # plugin.
        #
        # script-src is NOT set, and that is a decision rather than an
        # oversight. Livewire ships Alpine, which evaluates expressions written
        # in HTML attributes through the Function constructor - so any policy
        # without 'unsafe-eval' breaks every dropdown, modal and sidebar toggle
        # in the console, and a policy WITH 'unsafe-eval' and 'unsafe-inline'
        # buys close to nothing. Tightening this properly means Alpine's CSP
        # build and a nonce on every inline script, which is a real change and
        # wants its own testing rather than a line in a config file.
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite output is content-hashed, so a stale copy is impossible.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Repeated, not inherited. Declaring add_header in this block drops
            # every header set at server level, and a bundle served without
            # nosniff is exactly the kind of thing that is invisible until it
            # is not.
            add_header X-Content-Type-Options "nosniff" always;

            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_param PATH_INFO       $fastcgi_path_info;
            fastcgi_param HTTPS           $http_x_forwarded_proto;
            fastcgi_read_timeout 120;
            fastcgi_buffer_size  32k;
            fastcgi_buffers      16 16k;
            internal;
        }

        # Only the front controller is executable. Any other .php path - an
        # uploaded file, a leftover script - is a 404 rather than code.
        location ~ \.php$ { return 404; }

        location ~ /\.(?!well-known).* { deny all; }
    }
}
