user  www-data;
worker_processes  auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # Must stay at or above upload_max_filesize in php.ini, or nginx rejects a
    # large photo before PHP ever sees it and the user gets a bare 413.
    client_max_body_size 20M;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    server {
        # __PORT__ is substituted by docker/entrypoint.sh from Render's $PORT.
        listen      __PORT__ default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite output is content-hashed, so a stale copy is impossible.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_param PATH_INFO       $fastcgi_path_info;
            fastcgi_param HTTPS           $http_x_forwarded_proto;
            fastcgi_read_timeout 120;
            fastcgi_buffer_size  32k;
            fastcgi_buffers      16 16k;
            internal;
        }

        # Only the front controller is executable. Any other .php path - an
        # uploaded file, a leftover script - is a 404 rather than code.
        location ~ \.php$ { return 404; }

        location ~ /\.(?!well-known).* { deny all; }
    }
}
