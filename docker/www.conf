[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

; Sized for Render's 512 MB free instance. Each child runs roughly 40-60 MB.
; If the container is OOM-killed, drop max_children to 2 before anything else.
pm                   = dynamic
pm.max_children      = 4
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests      = 500

; CRITICAL - do not remove.
;
; php-fpm clears the environment of its workers by default. With it cleared,
; every variable set in Render's dashboard is invisible to env(), so the app
; boots with no database credentials and no APP_KEY and fails in ways that
; point nowhere near this file.
clear_env = no

catch_workers_output    = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
