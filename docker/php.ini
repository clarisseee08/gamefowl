; Tuned for Render's 512 MB free instance.

memory_limit          = 192M
upload_max_filesize   = 20M
post_max_size         = 21M
max_execution_time    = 60
max_input_vars        = 3000
expose_php            = Off
date.timezone         = Asia/Manila

; Errors go to the container stream so Render's log viewer shows them, and
; never to the response body - a stack trace on screen leaks the database host.
log_errors            = On
error_log             = /dev/stderr
display_errors        = Off

opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 96
opcache.interned_strings_buffer = 12
opcache.max_accelerated_files   = 15000

; The filesystem is immutable for the life of the container, so there is
; nothing to revalidate. Any deploy builds a new image.
opcache.validate_timestamps     = 0
opcache.revalidate_freq         = 0

; Kept on: Laravel reads docblock annotations at runtime in places.
opcache.save_comments           = 1

realpath_cache_size = 4096K
realpath_cache_ttl  = 600
