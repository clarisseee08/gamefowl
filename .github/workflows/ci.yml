# The test suite, Pint, and a PRODUCTION asset build.
#
# This exists because several comments in the codebase already claimed it did.
# App\Livewire\Broodcocks\Pedigree says "PedigreePerformanceTest asserts the
# query count, so a regression fails CI rather than quietly making the page
# slow" - which was only true once this file existed.
#
# WHY `npm run build` AND NOT JUST THE TESTS. Tailwind v4 resolves class names
# by scanning source at build time. A class assembled at runtime works under
# `npm run dev` and is simply absent from the production bundle, so the failure
# only ever appears on Render. Building here is what catches it.
#
# THE BUDGET, AND IT IS FAR LESS TIGHT THAN THIS FILE USED TO SAY.
#
# The estimate here was ~1800 minutes a month for keep-render-warm, leaving
# ~170 for this workflow. Counting its actual run history gives three or four
# runs a DAY rather than the sixty its cron asks for - GitHub throttles
# high-frequency schedules on private repositories - so it costs nearer 100
# minutes a month, not 1800. An external pinger now does that job properly and
# keep-render-warm is only a fallback, so the real figure heads towards zero.
#
# Actions minutes are still metered and GitHub still rounds every job up to a
# whole minute, so the measures below stay worth keeping:
#
#   - it runs on pushes to main and on pull requests, NOT on every branch push;
#   - Composer and npm caches are restored, which takes a warm run under 3 min;
#   - a new push cancels the run it superseded rather than queueing behind it.
#
# If the allowance starts to bite, narrow the `push` trigger before weakening
# any of the three checks - a green suite is the thing protecting everything
# else in this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests, Pint, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 8.2 to match composer.json's ^8.2, the Dockerfile's php:8.2-fpm-alpine,
      # and the version the suite is developed against. Testing on a version the
      # production image does not run would prove nothing about production.
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # pdo_sqlite is what phpunit.xml's in-memory database needs. The rest
          # mirror the Dockerfile so a missing-extension failure surfaces here.
          extensions: pdo_sqlite, sqlite3, bcmath, zip, intl, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.2-

      # WITH dev dependencies, unlike the Dockerfile: PHPUnit, Pint, Faker and
      # Collision all live in require-dev and all three checks below need them.
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Pint first: it is the fastest check, so a formatting-only failure costs
      # seconds rather than a full suite run.
      - name: Check formatting
        run: vendor/bin/pint --test

      # 20 to match the Dockerfile's assets stage. A newer Node very probably
      # builds the same bundle; "very probably" is not what CI is for.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      # BEFORE THE TESTS, and that ordering is the whole point of this step's
      # position rather than a preference.
      #
      # This job failed on every run in this repository's history - 61 tests at
      # a time, all with "Vite manifest not found at public/build/manifest.json"
      # - because the suite ran here and the assets were built afterwards.
      # public/build is gitignored, so on a clean runner no manifest existed
      # when the tests asked for one, and every test that renders a layout
      # carrying @vite died on it.
      #
      # It looked like a test failure and was a step-ordering one. The build has
      # to happen before anything renders a view.
      - name: Build production assets
        run: npm run build

      - name: Run the test suite
        run: php artisan test --compact
