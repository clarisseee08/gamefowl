# Keeps the Render web service from cold-starting.
#
# Render's free instance type spins down after 15 minutes with no traffic, and
# waking it takes 25-60 seconds - which, in front of a panel, reads as a broken
# system rather than a sleeping one.
#
# THIS WORKFLOW IS A FALLBACK, NOT THE ANSWER. Read the next section before
# trusting it with anything that matters.
#
# ---------------------------------------------------------------------------
# WHAT THIS ACTUALLY DELIVERS, MEASURED
# ---------------------------------------------------------------------------
#
# The schedule below asks for a ping every 12 minutes across a 12-hour window:
# 60 runs a day. GitHub delivers three or four, and ignores the window while
# doing it. Counted from the run history over eight consecutive days:
#
#   2026-09-06   1 run        expected 60
#   2026-09-07   3 runs       expected 60
#   2026-09-08   3 runs       expected 60
#   2026-09-09   3 runs       expected 60
#   2026-09-10   3 runs       expected 60
#   2026-09-11   3 runs       expected 60
#   2026-09-12   4 runs       expected 60
#   2026-09-13   3 runs       expected 60
#
# They land at roughly 02:15, 07:20 and 12:20 UTC every day - and 02:15 is not
# even inside the 03:00-14:59 window this file declares, so the window is not
# being honoured either. Every run reports success; nothing is failing and no
# minutes are exhausted. GitHub is simply throttling a high-frequency schedule
# on a private repository, which its own documentation permits it to do.
#
# So the real coverage is three 15-minute warm patches a day, roughly 45
# minutes out of 24 hours, not the 12 hours the schedule implies. Two of the
# five most recent runs found the instance already asleep and took 24s and 25s
# to get an answer, which is the wake-up cost being paid rather than avoided.
#
# Tuning the cron expression does not fix this. The interval is not what is
# being ignored - the scheduler is.
#
# ---------------------------------------------------------------------------
# THE ACTUAL FIX: AN EXTERNAL PINGER. Five minutes, free, no card.
# ---------------------------------------------------------------------------
#
# These services exist to do exactly this, are not subject to GitHub's
# throttling or its per-minute billing, and hold the schedule they are given.
#
#   cron-job.org  (no card, intervals down to 1 minute)
#     1. Sign up, then Cronjobs -> Create cronjob
#     2. URL      https://gfms-laravel.onrender.com/up
#     3. Schedule "Every 5 minutes"
#     4. Save. The execution history shows whether it is holding.
#
#   UptimeRobot  (alternative; also emails when the site is actually down)
#     1. Sign up, then + New monitor
#     2. Type     HTTP(s)
#     3. URL      https://gfms-laravel.onrender.com/up
#     4. Interval 5 minutes
#
# ONE THING TO CHECK AFTER SETTING IT UP. Render's free tier allows 750
# instance-hours a month and continuous uptime needs 720, so a single service
# pinged around the clock fits - but only just, and only if it is the only free
# service on the account. A second free service sharing the allowance will run
# both out before the month ends.
#
# Once an external pinger is running and you have watched it hold for a day,
# this workflow can be deleted. It is kept until then so that removing it does
# not leave zero coverage.
#
# BEFORE ANYTHING THAT MATTERS - a defence, a demo - open the site by hand a
# few minutes early, or trigger this workflow manually from the Actions tab.
# That is the only way to be certain, whatever is pinging it.
name: Keep Render warm

on:
  schedule:
    # Every 12 minutes, 03:00-14:59 UTC = 11:00-22:59 Manila.
    #
    # Left as-is deliberately. GitHub honours neither the interval nor the
    # window (see the measurements above), so editing this expression changes
    # what the file claims and not what happens. It is kept because three
    # unpredictable pings a day is still better than none while an external
    # pinger is being set up.
    - cron: '*/12 3-14 * * *'
  workflow_dispatch:

# A late run must never pile up behind an in-flight one.
concurrency:
  group: keep-render-warm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: Ping the health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Wake the app
        env:
          # /up is Laravel's health route. It is the cheapest endpoint that
          # still proves the PHP process is actually serving, rather than the
          # platform returning a holding page.
          URL: https://gfms-laravel.onrender.com/up
        run: |
          set -uo pipefail

          # A cold instance can take the better part of a minute to answer, and
          # the first attempt is the one that pays for the wake-up. Retry rather
          # than failing the run over an expected slow start.
          for attempt in 1 2 3 4 5 6; do
            start=$(date +%s)
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            elapsed=$(( $(date +%s) - start ))

            echo "attempt ${attempt}: HTTP ${code} in ${elapsed}s"

            if [ "$code" = "200" ]; then
              if [ "$elapsed" -gt 15 ]; then
                echo "::notice::Instance was asleep - took ${elapsed}s to answer."
              fi
              exit 0
            fi

            sleep 15
          done

          echo "::error::${URL} never returned 200. The service may be down, \
          suspended, or out of free instance-hours for the month."
          exit 1
